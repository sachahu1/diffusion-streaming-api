name: Release

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reset branch to the triggering commit
        run: git reset --hard ${{ github.sha }}

      # main -> stable release (vX.Y.Z), dev -> release candidate (vX.Y.Z-rc.N)
      # Branch rules live in [tool.semantic_release] in pyproject.toml.
      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  release-docs:
    needs:
      - release
    if: needs.release.outputs.released == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/build-and-release-docs.yaml
    with:
      ref: v${{ needs.release.outputs.version }}
