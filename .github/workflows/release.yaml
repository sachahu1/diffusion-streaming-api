name: Release

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reset branch to the triggering commit
        run: git reset --hard ${{ github.sha }}

      # main -> stable release (vX.Y.Z), dev -> release candidate (vX.Y.Z-rc.N)
      # Branch rules live in [tool.semantic_release] in pyproject.toml.
      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  release-docs:
    needs:
      - release
    if: needs.release.outputs.released == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/build-and-release-docs.yaml
    with:
      ref: v${{ needs.release.outputs.version }}

  # Only stable releases from main touch the production lambda.
  deploy-image:
    name: Push image to ECR and update lambda
    needs:
      - release
    if: needs.release.outputs.released == 'true' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required to request the OIDC JWT
      contents: read
    env:
      AWS_REGION: eu-west-2
      AWS_OIDC_ROLE_ARN: arn:aws:iam::980416368045:role/DiffusionApiGitHubDeploy
      ECR_REPOSITORY: 980416368045.dkr.ecr.eu-west-2.amazonaws.com/diffusion-api
      MODEL_WEIGHTS_URI: s3://sachahu.com/model-weights/new_checkpoint.pt
      LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
      IMAGE_TAG: v${{ needs.release.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          role-session-name: GitHub_diffusion_api_deploy
          aws-region: ${{ env.AWS_REGION }}

      # The weights are git-ignored; the Dockerfile COPYs them into the image.
      - name: Download model weights
        run: aws s3 cp "$MODEL_WEIGHTS_URI" new_checkpoint.pt

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push lambda image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: lambda
          push: true
          # Lambda rejects OCI image indexes / attestation manifests.
          provenance: false
          sbom: false
          tags: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point lambda at the new image
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$ECR_REPOSITORY:$IMAGE_TAG" > /dev/null
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"
