name: Release

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reset branch to the triggering commit
        run: git reset --hard ${{ github.sha }}

      # main -> stable release (vX.Y.Z), dev -> release candidate (vX.Y.Z-rc.N)
      # Branch rules live in [tool.semantic_release] in pyproject.toml.
      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  trigger-docs:
    runs-on: ubuntu-latest
    needs:
      - release
    if: needs.release.outputs.released == 'true'
    permissions:
      actions: write
    steps:
      - name: Invoke Documentation Workflow
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: Build And Release Docs
          ref: ${{ github.ref_name }}
