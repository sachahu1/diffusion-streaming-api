[project]
name = "diffusion-streaming-api"
version = "0.1.0-rc.2"
description = "A minimal API to stream the generation of images using Diffusion."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Sacha Hu", email = "sacha.hu@mindsparkai.com" }]
maintainers = [{ name = "Sacha Hu", email = "sacha.hu@mindsparkai.com" }]
dependencies = [
    "pillow>=11.0.0,<12",
    "torch>=2.4.0,<3",
    "torchvision>=0.20.0,<0.21",
    "fastapi[standard]>=0.115.4,<0.116",
    "diffusion-model-framework[inference]>=1.1.0,<2",
]

[project.urls]
Repository = "https://github.com/sachahu1/diffusion-streaming-api"

[project.scripts]
run_diffusion_streaming_api = "diffusion_streaming_api.cli:run"

[dependency-groups]
dev = [
    "ruff>=0.4.8,<0.5",
    "pre-commit>=3.7.1,<4",
]
test = [
    "pytest>=7.0,<9",
    "pytest-mock>=3.14.0,<4",
    "coverage[toml]>=6.4.2,<7",
]
documentation = [
    "Sphinx>=7.3.7,<8",
    "sphinxcontrib-napoleon>=0.7,<0.8",
    "sphinx-rtd-theme>=2.0.0,<3",
    "myst-parser>=3.0.1,<4",
    "sphinx-copybutton>=0.5.2,<0.6",
    "sphinx-autodoc-typehints>=2.1.1,<3",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv]
# Only the dev group is synced by default; test/documentation are opt-in
# (use `--group test` / `--group documentation`).
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch_cpu" }
torchvision = { index = "pytorch_cpu" }

[[tool.uv.index]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --junit-xml=test_results/tests.xml"
testpaths = ["tests"]

[tool.coverage.run]
source = ["diffusion_streaming_api"]

[tool.ruff]
line-length = 79
indent-width = 2
exclude = [".venv", ".env", ".git", "tests"]


[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
extend-select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ERA", # flake8-eradicate/eradicate
    "I",   # isort
    "N",   # pep8-naming
    "PIE", # flake8-pie
    "PGH", # pygrep
    "RUF", # ruff checks
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
]
fixable = ["ALL"]
ignore = ["SIM117"]

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2
known-first-party = ["diffusion_streaming_api"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_parser = "conventional"
commit_message = "chore(release): {version}"
allow_zero_version = true
major_on_zero = false
# The app ships as a container, so there is nothing to build or upload.
build_command = ""

[tool.semantic_release.remote]
type = "github"
upload_to_vcs_release = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.dev]
match = "dev"
prerelease = true
prerelease_token = "rc"
